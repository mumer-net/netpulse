! t1: transit router, AS 65000 (FRR)
frr defaults traditional
hostname t1
log stdout informational
service integrated-vtysh-config
ip forwarding
!
interface eth1
 description link4 to a1
 ip address 10.0.4.1/31
exit
!
interface eth2
 description link6 to b1
 ip address 10.0.6.1/31
exit
!
interface eth3
 description link3 to t2
 ip address 10.0.3.0/31
 ip ospf area 0
 ip ospf network point-to-point
 ip ospf hello-interval 1
 ip ospf dead-interval 4
exit
!
interface lo
 ip address 10.255.0.1/32
 ip ospf area 0
exit
!
router ospf
 ospf router-id 10.255.0.1
exit
!
router bgp 65000
 bgp router-id 10.255.0.1
 no bgp ebgp-requires-policy
 neighbor 10.0.4.0 remote-as 65001
 neighbor 10.0.4.0 description a1
 neighbor 10.0.4.0 timers 1 3
 neighbor 10.0.4.0 timers connect 5
 neighbor 10.0.6.0 remote-as 65002
 neighbor 10.0.6.0 description b1
 neighbor 10.0.6.0 timers 1 3
 neighbor 10.0.6.0 timers connect 5
 neighbor 10.255.0.2 remote-as 65000
 neighbor 10.255.0.2 description t2-ibgp
 neighbor 10.255.0.2 update-source lo
 neighbor 10.255.0.2 timers 1 3
 neighbor 10.255.0.2 timers connect 5
 !
 address-family ipv4 unicast
  network 10.255.0.1/32
  neighbor 10.0.4.0 activate
  neighbor 10.0.6.0 activate
  neighbor 10.255.0.2 activate
  neighbor 10.255.0.2 next-hop-self
 exit-address-family
exit
!
