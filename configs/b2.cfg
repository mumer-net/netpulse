! b2: Site B edge router, AS 65002 (Arista cEOS)
hostname b2
username admin privilege 15 role network-admin secret admin
!
service routing protocols model multi-agent
!
management api gnmi
   transport grpc default
!
management api http-commands
   no shutdown
!
! Management0 is the out-of-band port on the 172.20.20.0/24 clab network.
! gNMIc reaches the router here. No default route, so it never touches data-plane routing.
interface Management0
   description oob-mgmt
   ip address 172.20.20.22/24
!
ip routing
!
interface Ethernet1
   description link2 to b1 (site B internal)
   no switchport
   ip address 10.0.2.1/31
   ip ospf network point-to-point
   ip ospf hello-interval 1
   ip ospf dead-interval 4
!
interface Ethernet2
   description link7 to t2 (transit)
   no switchport
   ip address 10.0.7.0/31
   bfd interval 100 min-rx 100 multiplier 3
!
interface Loopback0
   description router-id
   ip address 10.255.2.2/32
!
ip route 192.168.2.0/24 Null0
!
router ospf 1
   router-id 10.255.2.2
   network 10.0.2.0/31 area 0.0.0.0
   network 10.255.2.2/32 area 0.0.0.0
!
router bgp 65002
   router-id 10.255.2.2
   neighbor 10.0.7.1 remote-as 65000
   neighbor 10.0.7.1 description t2-transit
   neighbor 10.0.7.1 timers 1 3
   neighbor 10.0.7.1 bfd
   neighbor 10.255.2.1 remote-as 65002
   neighbor 10.255.2.1 description b1-ibgp
   neighbor 10.255.2.1 update-source Loopback0
   neighbor 10.255.2.1 next-hop-self
   neighbor 10.255.2.1 timers 1 3
   !
   address-family ipv4
      neighbor 10.0.7.1 activate
      neighbor 10.255.2.1 activate
      network 10.255.2.2/32
      network 192.168.2.0/24
!
end
