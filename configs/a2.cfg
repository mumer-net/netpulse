! a2: Site A edge router, AS 65001 (Arista cEOS)
hostname a2
username admin privilege 15 role network-admin secret admin
!
service routing protocols model multi-agent
!
management api gnmi
   transport grpc default
!
management api http-commands
   no shutdown
!
! Management0 is the out-of-band port on the 172.20.20.0/24 clab network.
! gNMIc reaches the router here. No default route, so it never touches data-plane routing.
interface Management0
   description oob-mgmt
   ip address 172.20.20.12/24
!
ip routing
!
interface Ethernet1
   description link1 to a1 (site A internal)
   no switchport
   ip address 10.0.1.1/31
   ip ospf network point-to-point
   ip ospf hello-interval 1
   ip ospf dead-interval 4
!
interface Ethernet2
   description link5 to t2 (transit)
   no switchport
   ip address 10.0.5.0/31
!
interface Loopback0
   description router-id
   ip address 10.255.1.2/32
!
ip route 192.168.1.0/24 Null0
!
router ospf 1
   router-id 10.255.1.2
   network 10.0.1.0/31 area 0.0.0.0
   network 10.255.1.2/32 area 0.0.0.0
!
router bgp 65001
   router-id 10.255.1.2
   neighbor 10.0.5.1 remote-as 65000
   neighbor 10.0.5.1 description t2-transit
   neighbor 10.0.5.1 timers 1 3
   neighbor 10.255.1.1 remote-as 65001
   neighbor 10.255.1.1 description a1-ibgp
   neighbor 10.255.1.1 update-source Loopback0
   neighbor 10.255.1.1 next-hop-self
   neighbor 10.255.1.1 timers 1 3
   !
   address-family ipv4
      neighbor 10.0.5.1 activate
      neighbor 10.255.1.1 activate
      network 10.255.1.2/32
      network 192.168.1.0/24
!
end
