! t2: transit router, AS 65000 (FRR)
frr defaults traditional
hostname t2
log stdout informational
service integrated-vtysh-config
ip forwarding
!
interface eth1
 description link5 to a2
 ip address 10.0.5.1/31
exit
!
interface eth2
 description link7 to b2
 ip address 10.0.7.1/31
exit
!
interface eth3
 description link3 to t1
 ip address 10.0.3.1/31
 ip ospf area 0
 ip ospf network point-to-point
 ip ospf hello-interval 1
 ip ospf dead-interval 4
exit
!
interface lo
 ip address 10.255.0.2/32
 ip ospf area 0
exit
!
router ospf
 ospf router-id 10.255.0.2
exit
!
router bgp 65000
 bgp router-id 10.255.0.2
 no bgp ebgp-requires-policy
 neighbor 10.0.5.0 remote-as 65001
 neighbor 10.0.5.0 description a2
 neighbor 10.0.5.0 timers 1 3
 neighbor 10.0.5.0 timers connect 5
 neighbor 10.0.7.0 remote-as 65002
 neighbor 10.0.7.0 description b2
 neighbor 10.0.7.0 timers 1 3
 neighbor 10.0.7.0 timers connect 5
 neighbor 10.255.0.1 remote-as 65000
 neighbor 10.255.0.1 description t1-ibgp
 neighbor 10.255.0.1 update-source lo
 neighbor 10.255.0.1 timers 1 3
 neighbor 10.255.0.1 timers connect 5
 !
 address-family ipv4 unicast
  network 10.255.0.2/32
  neighbor 10.0.5.0 activate
  neighbor 10.0.7.0 activate
  neighbor 10.255.0.1 activate
  neighbor 10.255.0.1 next-hop-self
 exit-address-family
exit
!
