# v2: every interval is 1 s so the latency formula stays predictable (see README, Design plan).
global:
  scrape_interval: 1s
  scrape_timeout: 1s     # must not exceed scrape_interval
  evaluation_interval: 1s

rule_files:
  - /etc/prometheus/rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["172.20.20.103:9093"]

scrape_configs:
  - job_name: gnmic
    static_configs:
      - targets: ["172.20.20.101:9804"]
