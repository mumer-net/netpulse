groups:
  - name: netpulse
    rules:
      - alert: BGPSessionDown
        expr: netpulse_bgp_session_state == 0
        for: 0s
        labels:
          severity: critical
        annotations:
          summary: "BGP session {{ $labels.source }} -> {{ $labels.neighbor_neighbor_address }} is not Established"
          runbook_url: "https://github.com/mumer-net/netpulse/blob/main/runbooks/BGPSessionDown.md"

      - alert: InterfaceDown
        expr: netpulse_intf_oper_status{interface_name=~"Ethernet.*"} == 0
        for: 0s
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.source }} {{ $labels.interface_name }} is down"
          runbook_url: "https://github.com/mumer-net/netpulse/blob/main/runbooks/InterfaceDown.md"

      # No data is not good data: if gNMIc dies, metrics expire and the rules above go silent.
      - alert: TelemetryDown
        expr: up{job="gnmic"} == 0 or (count(count by (source) (netpulse_intf_oper_status)) or vector(0)) < 4
        for: 10s
        labels:
          severity: warning
        annotations:
          summary: "Telemetry gap: gNMIc is down or fewer than 4 routers are reporting"
          runbook_url: "https://github.com/mumer-net/netpulse/blob/main/runbooks/TelemetryDown.md"
