# NetPulse: two customer sites dual-homed to a transit provider, plus a monitoring stack.
# Deploy:   sudo containerlab deploy -t netpulse.clab.yml
# Redeploy: sudo containerlab deploy -t netpulse.clab.yml --reconfigure
name: netpulse

mgmt:
  network: clab
  ipv4-subnet: 172.20.20.0/24

topology:
  kinds:
    arista_ceos:
      image: ceos:4.36.2F

  nodes:
    # ---- Site A (AS 65001), Arista cEOS ----
    a1:
      kind: arista_ceos
      mgmt-ipv4: 172.20.20.11
      startup-config: configs/a1.cfg
    a2:
      kind: arista_ceos
      mgmt-ipv4: 172.20.20.12
      startup-config: configs/a2.cfg

    # ---- Site B (AS 65002), Arista cEOS ----
    b1:
      kind: arista_ceos
      mgmt-ipv4: 172.20.20.21
      startup-config: configs/b1.cfg
    b2:
      kind: arista_ceos
      mgmt-ipv4: 172.20.20.22
      startup-config: configs/b2.cfg

    # ---- Transit (AS 65000), FRR as plain linux containers ----
    t1:
      kind: linux
      image: quay.io/frrouting/frr:10.7.1
      mgmt-ipv4: 172.20.20.31
      sysctls:
        net.ipv4.ip_forward: 1 # transit must forward site A <-> site B traffic
      binds:
        - configs/t1.conf:/etc/frr/frr.conf
        - configs/frr-daemons:/etc/frr/daemons
        - configs/vtysh.conf:/etc/frr/vtysh.conf
    t2:
      kind: linux
      image: quay.io/frrouting/frr:10.7.1
      mgmt-ipv4: 172.20.20.32
      sysctls:
        net.ipv4.ip_forward: 1
      binds:
        - configs/t2.conf:/etc/frr/frr.conf
        - configs/frr-daemons:/etc/frr/daemons
        - configs/vtysh.conf:/etc/frr/vtysh.conf

    # ---- Telemetry stack ----
    gnmic:
      kind: linux
      image: ghcr.io/openconfig/gnmic:0.49.0
      mgmt-ipv4: 172.20.20.101
      binds:
        - telemetry/gnmic.yml:/app/gnmic.yml:ro
      cmd: "--config /app/gnmic.yml subscribe"
    prometheus:
      kind: linux
      image: prom/prometheus:v3.14.0
      mgmt-ipv4: 172.20.20.102
      binds:
        - telemetry/prometheus:/etc/prometheus:ro
      cmd: "--config.file=/etc/prometheus/prometheus.yml --storage.tsdb.path=/prometheus --web.enable-lifecycle"
      ports:
        - 9090:9090
    alertmanager:
      kind: linux
      image: prom/alertmanager:v0.34.1
      mgmt-ipv4: 172.20.20.103
      binds:
        - telemetry/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      cmd: "--config.file=/etc/alertmanager/alertmanager.yml --storage.path=/alertmanager"
      ports:
        - 9093:9093
    grafana:
      kind: linux
      image: grafana/grafana:13.2.2
      mgmt-ipv4: 172.20.20.104
      binds:
        - telemetry/grafana/datasources.yml:/etc/grafana/provisioning/datasources/netpulse.yml:ro
        - telemetry/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/netpulse.yml:ro
        - telemetry/grafana/dashboards:/var/lib/grafana/dashboards:ro
      env:
        GF_AUTH_ANONYMOUS_ENABLED: "true"
        GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
        GF_AUTH_DISABLE_LOGIN_FORM: "true"
      ports:
        - 3000:3000
    receiver:
      kind: linux
      image: python:3.13-slim
      mgmt-ipv4: 172.20.20.105
      binds:
        - tools/alert_receiver.py:/app/alert_receiver.py:ro
        - results:/results
      cmd: "python -u /app/alert_receiver.py --port 9095 --out /results/alerts.jsonl"

  links:
    - endpoints: ["a1:eth1", "a2:eth1"] # link 1  10.0.1.0/31  OSPF, site A
    - endpoints: ["b1:eth1", "b2:eth1"] # link 2  10.0.2.0/31  OSPF, site B
    - endpoints: ["t1:eth3", "t2:eth3"] # link 3  10.0.3.0/31  OSPF, transit
    - endpoints: ["a1:eth2", "t1:eth1"] # link 4  10.0.4.0/31  eBGP 65001-65000
    - endpoints: ["a2:eth2", "t2:eth1"] # link 5  10.0.5.0/31  eBGP 65001-65000
    - endpoints: ["b1:eth2", "t1:eth2"] # link 6  10.0.6.0/31  eBGP 65002-65000
    - endpoints: ["b2:eth2", "t2:eth2"] # link 7  10.0.7.0/31  eBGP 65002-65000
